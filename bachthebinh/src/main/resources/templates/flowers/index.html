<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Flower Shop - Hutech Store</title>
<meta name="keywords" content="free website template, flower shop, website templates, CSS, HTML" />
<meta name="description" content="Flower Shop - free website template, W3C compliant HTML CSS layout" />
<link th:href="@{/css/templatemo_style.css}" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
<div id="templatemo_container">
    <div id="templatemo_top_panel">
        <div id="templatemo_language_section" style="width: auto; padding-top: 5px;">
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" style="color: #ffffff; text-decoration: none; font-weight: bold; margin-right: 10px;">Đăng nhập</a>
                <span style="color: #ffffff;">|</span>
                <a th:href="@{/register}" style="color: #ffffff; text-decoration: none; font-weight: bold; margin-left: 10px;">Đăng ký</a>
            </div>
            <div sec:authorize="isAuthenticated()" style="color: #ffffff; font-weight: bold;">
                Xin chào, <span sec:authentication="name" style="color: #ffff00;">User</span> 
                <span style="margin: 0 10px;">|</span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" style="background: transparent; border: none; color: #ffcccc; cursor: pointer; font-weight: bold; font-family: Tahoma, sans-serif;">Đăng xuất</button>
                </form>
            </div>
        </div>
<div id="templatemo_shopping_cart">
            Shopping Cart <span>(<a th:href="@{/cart}">Xem giỏ hàng</a>)</span>      
        </div>
    </div>
     
    <div id="templatemo_header">
        <img th:href="@{/images/templatemo_site_header.jpg}" alt="Flower Shop" />
    </div>
     
    <div id="templatemo_banner">
        <a href="#"><img th:src="@{/images/templatemo_banner_image.jpg}" alt="Flower Shop Banner" border="0" /></a>     
    </div>
<div id="templatemo_menu_panel">
        <ul>
            <li><a th:href="@{/}" class="current">Home</a></li>
            <li><a th:href="@{/books}">Book Store</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">About Us</a></li> 
            <li><a href="#">Contact Us</a></li>                    
        </ul> 
    </div>

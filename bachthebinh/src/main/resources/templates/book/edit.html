<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section}, title='Edit Book')}">
<head>
    <title>Edit Book</title>
</head>
<body>
    <section>
        <div class="container">
            <h1>Edit Book</h1>
            
            <form th:action="@{/books/edit}" th:object="${book}" method="post" enctype="multipart/form-data">
                
                <input type="hidden" th:field="*{id}">
                
                <input type="hidden" th:field="*{image}">
                
                <div class="col-6 mb-3">
                    <label class="form-label" for="title">Title:</label>
                    <input class="form-control" type="text" th:field="*{title}" id="title">
                    <span class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>

                <div class="col-6 mb-3">
                    <label class="form-label" for="author">Author:</label>
                    <input class="form-control" type="text" th:field="*{author}" id="author">
                    <span class="text-danger" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
                </div>

                <div class="col-6 mb-3">
                    <label class="form-label" for="price">Price:</label>
                    <input class="form-control" type="text" th:field="*{price}" id="price">
                    <span class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                </div>

                <div class="col-6 mb-3">
                    <label class="form-label" for="category">Category:</label>
                    <select class="form-control" id="category" th:field="*{category.id}">
                        <option th:each="category : ${categories}" 
                                th:value="${category.id}" 
                                th:text="${category.name}">
                        </option>
                    </select>
                    <span class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                </div>

                <div class="col-6 mb-4">
                    <label class="form-label fw-bold">Book Cover (Image):</label><br>
                    
                    <div class="mb-2" th:if="${book.image != null and book.image != ''}">
                        <img th:src="@{'/images/' + ${book.image}}" alt="Current Image" 
                             class="img-thumbnail" style="max-height: 150px; object-fit: cover;">
                    </div>
                    
                    <input class="form-control" type="file" name="imageFile" accept="image/*">
                    <small class="text-muted fst-italic">Leave blank if you don't want to change the image.</small>
                </div>

                <input type="submit" class="btn btn-primary" value="Save Changes">
            </form>
            <br>
            <a th:href="@{/books}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left"></i> Back to List
            </a>
        </div>
    </section>
</body>
</html>
